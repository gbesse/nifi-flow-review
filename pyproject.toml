[project]
name = "nifi-flow-review"
version = "0.1.0"
description = "Structural PR review for NiFi versioned flows"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
nifi-flow-review = "flow_review:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["flow_review"]
